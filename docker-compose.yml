services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-deviatyhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-deviatyhub}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - deviaty-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Solo loopback, igual que postgres. Redis no lleva contraseña y aquí vive
      # la cola de mensajes de pacientes: publicarlo en 0.0.0.0 lo dejaba
      # accesible desde internet sin autenticación. Los servicios se conectan
      # por la red de docker (redis://redis:6379), no por el puerto del host.
      - "127.0.0.1:6379:6379"
    networks:
      - deviaty-net

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CORE_SERVICE_URL=http://core-service:3002
      - AGENT_SERVICE_URL=http://agent-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
      - WEBHOOK_SERVICE_URL=http://webhook-service:3005
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
    depends_on:
      - redis
    networks:
      - deviaty-net

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  core-service:
    build:
      context: .
      dockerfile: apps/core-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Modelos. Sin valor en el .env se usan los del código (gpt-4o-mini), así
      # que cambiarlos es editar el .env del servidor y reiniciar el servicio.
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_CLASSIFIER_MODEL=${OPENAI_CLASSIFIER_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  webhook-service:
    build:
      context: .
      dockerfile: apps/webhook-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3005
      - REDIS_URL=redis://redis:6379
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
    depends_on:
      - redis
    networks:
      - deviaty-net

  whatsapp-service:
    build:
      context: .
      dockerfile: apps/whatsapp-service/Dockerfile
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3006
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - core-service
      - webhook-service
    networks:
      - deviaty-net

networks:
  deviaty-net:
    driver: bridge

volumes:
  pgdata:
