# PUERTOS. Ningún servicio interno se publica en la IP pública: no verifican
# tokens por su cuenta y se fían de las cabeceras x-clinic-id / x-user-id /
# x-is-superadmin que pone el gateway. Publicados en 0.0.0.0, cualquiera podía
# saltarse el gateway y leer o modificar los datos de cualquier clínica.
# - gateway (3000), core (3002, socket.io) y webhook (3005) se atan a docker0
#   (172.17.0.1), que es por donde entra el Caddy de app.dentral.cl. En una
#   máquina sin docker0 (Docker Desktop), PROXY_BIND_IP=127.0.0.1 en el .env.
# - El resto solo en 127.0.0.1, para depurar desde el propio servidor.
# - nginx (80) sigue público: es la entrada del túnel de Cloudflare y enruta
#   únicamente /api (al gateway), /webhook y /socket.io.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-deviatyhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-deviatyhub}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - deviaty-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Solo loopback, igual que postgres. Redis no lleva contraseña y aquí vive
      # la cola de mensajes de pacientes: publicarlo en 0.0.0.0 lo dejaba
      # accesible desde internet sin autenticación. Los servicios se conectan
      # por la red de docker (redis://redis:6379), no por el puerto del host.
      - "127.0.0.1:6379:6379"
    networks:
      - deviaty-net

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_IP:-172.17.0.1}:3000:3000"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CORE_SERVICE_URL=http://core-service:3002
      - AGENT_SERVICE_URL=http://agent-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
      - WEBHOOK_SERVICE_URL=http://webhook-service:3005
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
    depends_on:
      - redis
    networks:
      - deviaty-net

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Correos del equipo de la plataforma (backoffice), separados por coma.
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  core-service:
    build:
      context: .
      dockerfile: apps/core-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_IP:-172.17.0.1}:3002:3002"
    environment:
      # Enlace de invitación que el backoffice muestra al dar de alta una clínica.
      - FRONTEND_URL=${FRONTEND_URL:-https://app.dentral.cl}
      # Estado de la cola de mensajes para el backoffice (red interna).
      - AGENT_SERVICE_URL=http://agent-service:3003
      # Para distinguir en "Equipo Dentral" el acceso fijado en el servidor.
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS:-}
      # Para mostrar en el backoffice qué clínica usa el número global de WhatsApp.
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_DEFAULT_CLINIC_ID=${WHATSAPP_DEFAULT_CLINIC_ID:-}
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  agent-service:
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Modelos. Sin valor en el .env se usan los del código (gpt-4o-mini), así
      # que cambiarlos es editar el .env del servidor y reiniciar el servicio.
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_CLASSIFIER_MODEL=${OPENAI_CLASSIFIER_MODEL:-}
      # Solo aplica a modelos de razonamiento (gpt-5, o1...): minimal | low |
      # medium | high. Por defecto 'minimal', porque el razonamiento cuesta
      # segundos por turno y aquí aporta poco.
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-}
      # Enrutado de WhatsApp: cada mensaje entrante va a la clínica dueña del
      # número que lo recibió. Hace falta la clave para leer el número de las
      # integraciones antiguas, y el número global del .env para saber cuál es.
      # Los mensajes a ese número global van a WHATSAPP_DEFAULT_CLINIC_ID o, si
      # está vacía, a la clínica más antigua.
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_DEFAULT_CLINIC_ID=${WHATSAPP_DEFAULT_CLINIC_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:3004"
    environment:
      # Cada cuántos minutos se revisan los recordatorios (3 días, 1 día, 2 horas).
      - REMINDER_INTERVAL_MIN=${REMINDER_INTERVAL_MIN:-5}
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3004
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GMAIL_USER=${GMAIL_USER}
      # Base de los enlaces de los correos (invitaciones). Sin ella caían a
      # http://localhost:3000.
      - FRONTEND_URL=${FRONTEND_URL:-https://app.dentral.cl}
      - GMAIL_PASS=${GMAIL_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  webhook-service:
    build:
      context: .
      dockerfile: apps/webhook-service/Dockerfile
    restart: unless-stopped
    ports:
      - "${PROXY_BIND_IP:-172.17.0.1}:3005:3005"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3005
      - REDIS_URL=redis://redis:6379
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
    depends_on:
      - redis
    networks:
      - deviaty-net

  whatsapp-service:
    build:
      context: .
      dockerfile: apps/whatsapp-service/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      # Los contenedores corrían en UTC mientras la clínica opera en Santiago:
      # la disponibilidad construía los horarios con la hora del contenedor y
      # descartaba como pasada toda la tarde.
      - TZ=${CLINIC_TIMEZONE:-America/Santiago}
      - CLINIC_TIMEZONE=${CLINIC_TIMEZONE:-America/Santiago}
      - PORT=3006
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - deviaty-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - core-service
      - webhook-service
    networks:
      - deviaty-net

networks:
  deviaty-net:
    driver: bridge

volumes:
  pgdata:
