name: Deploy backend (producción)

# Despliega al VPS por SSH cuando se hace push a main (o manualmente).
# Requiere estos GitHub Secrets:
#   DEPLOY_HOST     -> IP/host del servidor (p.ej. 158.69.202.175)
#   DEPLOY_USER     -> usuario SSH (p.ej. ubuntu)
#   DEPLOY_SSH_KEY  -> clave privada del deploy key (ed25519) autorizada en el server
#
# El servidor debe tener: Docker + docker compose, y el repo clonado en
# ~/backend-deviatyhub con un archivo .env (NO versionado) con los secretos reales.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Puerta previa al deploy: arranca el core-service con Prisma mockeado y un
  # Redis efímero, y comprueba los flujos críticos. Corre aquí y no en el
  # servidor porque el script publica eventos en el bus: contra la infra real
  # los consumirían los servicios de producción.
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # prisma generate exige la variable aunque no llegue a conectarse.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        # --legacy-peer-deps para igualar lo que hace el Dockerfile: @nestjs/config
        # 3.x declara peer de NestJS 8-10 y el proyecto va con 11, así que sin el
        # flag npm aborta. Se mantiene "ci" para instalar desde el lockfile.
        run: npm ci --legacy-peer-deps

      - name: Generar cliente de Prisma
        run: npx prisma generate --schema packages/shared-prisma/prisma/schema.prisma

      - name: Compilar core-service y sus dependencias
        run: npx turbo run build --filter=@deviaty/core-service...

      - name: Verificar core-service
        run: npm run verify --workspace @deviaty/core-service

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/backend-deviatyhub

            echo "==> Actualizando código (main)"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main

            echo "==> Build de imágenes"
            docker compose build

            echo "==> Levantando servicios (redis, postgres, microservicios)"
            docker compose up -d

            echo "==> Migraciones"
            docker compose run --rm -w /app/packages/shared-prisma auth-service \
              npx prisma db push --skip-generate

            # El seed NO se ejecuta aquí: borraba y regeneraba el dataset de la
            # clínica, así que cada despliegue destruía las citas de pacientes
            # reales y cambiaba los IDs de doctores y tratamientos. Es una
            # herramienta de arranque, no un paso de despliegue; para poblar un
            # entorno nuevo se lanza a mano desde el servidor:
            #   docker compose run --rm -w /app/packages/shared-prisma auth-service npx tsx prisma/seed.ts

            echo "==> Estado final"
            docker compose ps
